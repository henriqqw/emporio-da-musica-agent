<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empório da Música — Assistente</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>Empório da Música 🎸</h1>
    <p>Assistente virtual — demo do canal WhatsApp</p>
  </header>

  <section class="identity" aria-label="Identificação do cliente">
    <label>Seu WhatsApp (simulado)
      <input id="phone" inputmode="tel" placeholder="(67) 99654-7821" autocomplete="off">
    </label>
    <label>Nome no perfil (opcional)
      <input id="name" placeholder="Ana" autocomplete="off">
    </label>
    <button type="button" class="secondary" id="reset">Nova conversa</button>
  </section>

  <main id="messages" aria-live="polite"></main>

  <form id="composer">
    <input id="text" placeholder="Digite uma mensagem" autocomplete="off" maxlength="2000">
    <button id="send">Enviar</button>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
