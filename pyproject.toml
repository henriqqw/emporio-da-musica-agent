[project]
name = "emporio-da-musica-agent"
version = "1.0.0"
description = "Customer-service agent for Empório da Música"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
# Code blocks in docs are illustrative; only lint/format real Python files.
include = ["*.py"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
files = ["emporio", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
